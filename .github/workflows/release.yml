name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: linux
            arch: amd64
            runner: ubuntu-latest
          - target: linux-arm64
            os: linux
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6"
          python -m pip install .
      - name: Align package version with release tag
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          sed -i "s/^version = .*/version = \"${VERSION}\"/" pyproject.toml
      - name: Build binary
        run: pyinstaller --onefile --name user-installed-packages src/user_installed_packages/__main__.py
      - name: Package binary
        run: |
          VERSION="${VERSION}"
          cd dist
          tar czf "user-installed-packages-v${VERSION}.${{ matrix.os }}-${{ matrix.arch }}.tar.gz" \
            user-installed-packages
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  smoke:
    name: Smoke test ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist
      - name: Extract and smoke test
        run: |
          tar xzf dist/*.tar.gz
          chmod +x user-installed-packages
      - name: Smoke test binary
        run: ./user-installed-packages --version
      - name: Smoke test package detection
        run: ./user-installed-packages --json > /dev/null

  release:
    name: Publish release
    needs: smoke
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum dist/*.tar.gz > dist/checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/checksums.txt
          generate_release_notes: true
